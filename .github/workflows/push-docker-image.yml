name: Push Docker Image to Azure Container Registry and Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          - production
          - testing

jobs:
  set-github-environment:
        runs-on: ubuntu-latest
        outputs:
            environment: ${{ steps.set-env.outputs.target_env }}
        steps:
            - name: Set Environment
              id: set-env
              run: |
                case "${{ inputs.environment }}" in
                    testing)     echo "target_env=test" >> $GITHUB_OUTPUT ;;
                    develop) echo "target_env=dev" >> $GITHUB_OUTPUT ;;
                    staging)     echo "target_env=stage" >> $GITHUB_OUTPUT ;;
                    production)  echo "target_env=prod" >> $GITHUB_OUTPUT ;;
                esac
  build:
    runs-on: ubuntu-latest
    name: "Build"
    needs: set-github-environment
    concurrency:
      group: build
      cancel-in-progress: true
    outputs:
        sha: ${{ steps.commit.outputs.sha }}
    steps:
        - uses: actions/checkout@v4
          with:
            ref:  ${{ github.event.inputs.environment }}

        # The commit actually checked out, which differs from github.sha when
        # the workflow is dispatched from a branch other than the environment's.
        - name: Get commit
          id: commit
          run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

        - uses: docker/login-action@v3
          with:
            registry: ${{ vars.DOCKERHUB_REGISTRY }}
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            
        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        
        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            platforms: linux/amd64
            build-args: |
              CODE_VERSION=${{ steps.commit.outputs.sha }}
            tags: ${{ vars.DOCKERHUB_REGISTRY }}/workspaces-backend-v2:${{ needs.set-github-environment.outputs.environment }},
                  ${{ vars.DOCKERHUB_REGISTRY }}/workspaces-backend-v2:${{ steps.commit.outputs.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: [build,set-github-environment]
    name: "Deploy to Azure"
    steps:
      - name: Display environment
        run: echo "Deploying to ${{ needs.set-github-environment.outputs.environment }}"
      - name: Login to Azure
        uses: azure/login@v2.0.0
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}
      # Deploy the commit's tag, not the moving environment tag: an unchanged
      # image name leaves the container config unchanged, so Azure neither
      # pulls nor restarts and the old code keeps running.
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ws-backend-${{ needs.set-github-environment.outputs.environment }}
          sitecontainers-config: |
            [
              {
                "name": "main",
                "image": "${{ vars.DOCKERHUB_REGISTRY }}/workspaces-backend-v2:${{ needs.build.outputs.sha }}",
                "targetport": "8000",
                "isMain": true
              }
            ]
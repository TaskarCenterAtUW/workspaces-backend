name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Cancel any in-progress run for the same branch/PR when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.5.8"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Runs the same checks locals get from scripts/ci.sh: uv sync, isort,
    # black, pyright, and pytest. `--integration` additionally runs the
    # PostGIS/testcontainers suite (`pytest -m integration`); the ubuntu-latest
    # runner ships a running Docker daemon, which testcontainers needs to boot
    # the database. The script runs every check and exits non-zero if any fail,
    # so a single red step still lists all failures.
    - name: Run CI checks
      run: ./scripts/ci.sh --integration

    # Renders the test tally + per-file coverage table onto the run's summary
    # page (and this step's log), mirroring the frontend repo's summary. The
    # script reads reports/junit-*.xml and .coverage, both written by the step
    # above. `always()` so a red run still reports what it managed to collect;
    # the script degrades to omitting a section rather than failing, so it never
    # turns a green build red.
    - name: Publish test & coverage summary
      if: always()
      run: uv run python scripts/ci-summary.py

    - name: Build HTML coverage report
      if: always()
      run: uv run coverage html || true

    - name: Upload HTML coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-py${{ matrix.python-version }}
        path: htmlcov/
        if-no-files-found: ignore
        retention-days: 14

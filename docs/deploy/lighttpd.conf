# VENDORED COPY — NOT USED BY THIS REPO AT RUNTIME.
#
# Source: TaskarCenterAtUW/workspaces-stack, osm-web/lighttpd.conf @ main
#   https://github.com/TaskarCenterAtUW/workspaces-stack/blob/main/osm-web/lighttpd.conf
# Copied: 2026-09-01
#
# WHY THIS IS HERE
#
# This is the config the `osm-web` container is actually running in the
# deployed (manually-provisioned Azure) environment, i.e. the thing sitting
# between this backend and osm-rails / osm-cgimap:
#
#     client -> workspaces-backend (uvicorn) -> osm-web (lighttpd) -> osm-rails
#                                                                  \-> osm-cgimap
#
# Verified 2026-09-01 against the live public OSM host, which returns the
# upstream's Server header alongside the backend's own:
#
#     $ curl -sSI https://osm.workspaces.sidewalks.washington.edu/api/capabilities.json
#     Server: uvicorn
#     Server: lighttpd/1.4.64
#
# READ THIS BEFORE BELIEVING THE COMMENT BELOW
#
# The upstream file's own header (kept verbatim below) claims "We don't use
# lighttpd anymore. Nginx replaced lighttpd." That is NOT true of the deployed
# environment as of the date above -- lighttpd is what answers in production.
# A sibling nginx.conf does exist in workspaces-stack and is the intended
# successor, but it is not deployed. The two configs are not equivalent: only
# nginx.conf implements the /workspace/{id}/ path prefix, the x_workspace query
# parameter, and Basic-auth TDEI tokens, so those features are not live
# anywhere today.
#
# This copy is documentation only. The authoritative file lives in
# workspaces-stack; if that changes, re-copy rather than editing here.
###############################################################################

#
# This file is based on openstreetmap-cgimap's lighttpd configuration example:
# https://github.com/zerebubuth/openstreetmap-cgimap/blob/master/lighttpd.conf
#
# We don't use lighttpd anymore. We'll keep this reference file for now. Nginx
# replaced lighttpd, and a similar configuration exists in nginx.conf.
#

server.reject-expect-100-with-417 = "disable"

# selecting modules
server.modules = ( "mod_access", "mod_rewrite", "mod_fastcgi",  "mod_proxy", "mod_alias", "mod_extforward" )

# Set allow setting X-Forwarded-* headers for upstream:
extforward.forwarder = ("all" => "trust" )
extforward.params = ( "remote_user" => 1 )

# handling unknown routes
server.error-handler-404   = "/dispatch.map"

# include, relative to dirname of main config file
#include "mime.types.conf"

#debug.log-request-handling = "enable"

$HTTP["request-method"] == "GET" {
  url.rewrite-once = (
    "^/api/0\.6/map(\.(json|xml))?(\?(.*))?$" => "/dispatch.map",
    "^/api/0\.6/(node|way|relation)/[[:digit:]]+(\.(json|xml))?$" => "/dispatch.map",
    "^/api/0\.6/(node|way|relation)/[[:digit:]]+/history.*$" => "/dispatch.map",
    "^/api/0\.6/(node|way|relation)/[[:digit:]]+/[[:digit:]]+.*$" => "/dispatch.map",
    "^/api/0\.6/(node|way|relation)/[[:digit:]]+/relations$" => "/dispatch.map",
    "^/api/0\.6/node/[[:digit:]]+/ways$" => "/dispatch.map",
    "^/api/0\.6/(way|relation)/[[:digit:]]+/full$" => "/dispatch.map",
    "^/api/0\.6/changeset/[[:digit:]]+.*$" => "/dispatch.map",
    "^/api/0\.6/(nodes|ways|relations)(\?(.*))?$" => "/dispatch.map",
    "^/api/0\.6/changeset/[[:digit:]]+/download$" => "/dispatch.map",
  )
}

$HTTP["request-method"] == "POST" {
  url.rewrite-once = (
    "^/api/0\.6/changeset/[[:digit:]]+/upload.*$" => "/dispatch.map",
  )
}

$HTTP["request-method"] == "PUT" {
  url.rewrite-once = (
    "^/api/0\.6/changeset/[[:digit:]]+/close.*$" => "/dispatch.map",
    "^/api/0\.6/changeset/[[:digit:]]+$" => "/dispatch.map",
    "^/api/0\.6/changeset/create.*$" => "/dispatch.map",
  )
}

$HTTP["url"] =~ "^/(?!(dispatch\.map))" {
    proxy.server = ( "" => ( ( "host" => "osm-rails", "port" => "3000" ) ) )
    proxy.forwarded = ( "for" => 1,
                        "proto" => 1,
                        "host" => 1,
                        "by" => 1,
                        "remote_user" => 1
    )
}

#fastcgi.debug = 1

# For use with Dockerfile
fastcgi.server = ( ".map" =>
  (( "host"   => "osm-cgimap",
     "port"   => 8000,
     "check-local" => "disable",
     "connect-timeout" => 0,
  ))
)
